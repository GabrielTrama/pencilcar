name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PencilCar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PencilCar-apk
          path: PencilCar.apk
      - name: Publicar o APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pencil Car 1.0.${{ github.run_number }}
          body: "Baixe o **PencilCar.apk** abaixo e instale no celular."
          files: PencilCar.apk
          make_latest: true
